name: First offline EEG pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-pilot:
    # Standard public-repository runners only. A private fork is skipped before
    # runner allocation; this workflow never selects paid larger runners.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      NUMBA_NUM_THREADS: '4'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the triggering scientific revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - name: Install CPU inference dependencies
        id: setup
        run: |
          set -euo pipefail
          mkdir -p logs/cloud-setup
          python -m pip install --upgrade pip 2>&1 | tee logs/cloud-setup/pip-upgrade.log
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee logs/cloud-setup/torch-install.log
          python -m pip install -r requirements-cloud.txt 2>&1 | tee logs/cloud-setup/dependencies.log
          python -m pip check 2>&1 | tee logs/cloud-setup/pip-check.log
      - name: Run stage A, then paired perturbations and oracle diagnostics
        id: pilot
        run: python pilot/cloud_run.py --timeout-minutes 80
      - name: Write final status summary
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PILOT_OUTCOME: ${{ steps.pilot.outcome }}
        run: python pilot/cloud_run.py --summary-only
      - name: Preserve completed and partial scientific outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offline-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          compression-level: 6
          if-no-files-found: warn
          path: |
            results/gha-*/
            logs/cloud-setup/
            manifests/
            pilot/config_smoke.json
            requirements-cloud.txt
            docs/SOURCE_AUDIT.md
